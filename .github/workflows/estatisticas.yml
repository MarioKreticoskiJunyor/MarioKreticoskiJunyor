# Gera os cards de estatísticas e de linguagens com o token do dono do perfil
# (incluindo repositórios privados) e publica as imagens no GitHub Pages.
# Não faz commit: as imagens vão para o Pages, fora do histórico do repositório.

name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03h de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/estatisticas.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # "contributions" segue a opção de contribuições privadas do perfil;
          # "commits" é escondido porque, com token fine-grained, conta só os públicos.
          # Em inglês porque a ferramenta ainda não traduz "contributions" para pt-br.
          options: username=MarioKreticoskiJunyor&show_icons=true&theme=dark&locale=en&show=contributions&hide=commits
          path: cards/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=MarioKreticoskiJunyor&layout=compact&theme=dark&locale=pt-br
          path: cards/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Gráfico de atividade
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        with:
          USERNAME: MarioKreticoskiJunyor
          THEME: github_dark
          TIME_ZONE: America/Sao_Paulo
          AUTO_PUSH: false

      - name: Calendário 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          USERNAME: MarioKreticoskiJunyor

      - name: Reunir as imagens
        run: |
          cp profile-summary-card-output/github_dark/0-profile-details.svg cards/atividade.svg
          mkdir -p cards/3d
          cp profile-3d-contrib/*.svg cards/3d/

      - name: Empacotar as imagens para o Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: cards

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
