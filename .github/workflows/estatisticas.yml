# Gera os cards de estatísticas e de linguagens com o token do dono do perfil
# (incluindo repositórios privados) e publica as imagens no GitHub Pages.
# Não faz commit: as imagens vão para o Pages, fora do histórico do repositório.

name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03h de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/estatisticas.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # "contributions" segue a opção de contribuições privadas do perfil;
          # "commits" é escondido porque, com token fine-grained, conta só os públicos.
          # Em inglês porque a ferramenta ainda não traduz "contributions" para pt-br.
          options: username=MarioKreticoskiJunyor&show_icons=true&theme=dark&locale=en&show=contributions&hide=commits
          path: cards/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=MarioKreticoskiJunyor&layout=compact&theme=dark&locale=pt-br
          path: cards/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Gráfico de atividade
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        with:
          USERNAME: MarioKreticoskiJunyor
          THEME: github_dark
          TIME_ZONE: America/Sao_Paulo
          AUTO_PUSH: false

      - name: Reunir as imagens
        run: cp profile-summary-card-output/github_dark/0-profile-details.svg cards/atividade.svg

      # O token com read:user faz o gráfico de atividade exibir o e-mail da conta.
      # Remove o texto e o ícone e interrompe a publicação se sobrar algum e-mail.
      # A 4ª linha do card (ícone em y=84) só é o e-mail quando ele existe; sem
      # e-mail, ela mostra a localização, e o ícone deve ficar.
      - name: Remover o e-mail do gráfico de atividade
        run: |
          python3 - cards/atividade.svg <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          sem_email = re.sub(r'<text[^>]*>[^<]*@[^<]*</text>', '', s)
          if sem_email != s:
              sem_email = re.sub(r'<g transform="translate\(0,84\)"[^>]*>.*?</g>', '', sem_email, count=1, flags=re.S)
          s = sem_email
          if re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', s):
              sys.exit("e-mail ainda presente")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Empacotar as imagens para o Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: cards

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
